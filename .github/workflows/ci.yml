name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint: 
    runs-on: ubuntu-latest
    
    steps:
    - name: Flake8 action
      uses: suo/flake8-github-action@v1
      with:
        checkName: lint

    
  build:
    needs: lint

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
