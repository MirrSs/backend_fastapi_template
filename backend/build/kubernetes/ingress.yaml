apiVersion: networking.k8s.io/v1   
kind: Ingress   
metadata:   
  name: load-balance    
spec:   
  rules:   
    - host: fastapi.template.com  
      http:   
        paths:   
          - path: /
            pathType: Prefix   
            backend:   
              service:   
                name: fastapi-main
                port:   
                  number: 8000