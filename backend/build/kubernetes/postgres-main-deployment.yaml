apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: db
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:12.0-alpine
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-pv-claim
        envFrom:
          - configMapRef:
              name: fastapi-main-env
        ports:
          - containerPort: 5432
        resources: { }
      restartPolicy: Always
      volumes:
      - name: postgres-pv-claim
        persistentVolumeClaim:
          claimName: postgres-pv-claim
